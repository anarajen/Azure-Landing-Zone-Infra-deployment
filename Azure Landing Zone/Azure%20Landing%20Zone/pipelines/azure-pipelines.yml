trigger: none
pr: none

variables:
- name: terraformVersion
  value: '1.15.8'

- name: azureServiceConnection
  value: 'SPN-AzureDevOps'

- name: tfRoot
  value: '$(Build.SourcesDirectory)'

- name: tfVars
  value: 'environments/prod/terraform.tfvars'

- name: backendConfig
  value: 'environments/prod/backend.hcl'

- group: iwmf2-prod-secrets


stages:

# ==========================================================
# STAGE 1 - VALIDATE AND PLAN
# ==========================================================
- stage: ValidatePlan
  displayName: Terraform Validate and Plan

  jobs:
  - job: Plan
    displayName: Validate and produce reviewed plan

    pool:
      name : agent-iwmf-sea-pipeline-01

    steps:
    - checkout: self
      clean: true
      persistCredentials: false
    - script: |
       curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
       sudo apt-get install -y unzip
      displayName: Install Azure CLI     

    - task: AzureCLI@2
      displayName: Terraform fmt, init, validate and plan

      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        addSpnToEnvironment: true
        workingDirectory: '$(tfRoot)'

        inlineScript: |
          set -euo pipefail

          echo "=================================================="
          echo " IWMF2 Terraform Validate and Plan"
          echo "=================================================="

          export TERRAFORM_VERSION='$(terraformVersion)'

          bash ./scripts/install-terraform.sh

          export PATH="$HOME/bin:$PATH"

          terraform version

          # --------------------------------------------------
          # Azure DevOps Workload Identity Federation
          # --------------------------------------------------
          source ./scripts/export-azure-oidc.sh

          # --------------------------------------------------
          # Validate Azure identity
          # --------------------------------------------------
          EXPECTED_SUBSCRIPTION_ID="0bec3890-91f5-46f9-954a-434049775d9a"
          EXPECTED_TENANT_ID="3931aa7a-2905-494d-81a2-a046c1c68db7"
          EXPECTED_CLIENT_ID="05069eac-f757-41c7-85cf-e2180adbbf14"

          CURRENT_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          CURRENT_TENANT_ID=$(az account show --query tenantId -o tsv)

          echo ""
          echo "Subscription : $CURRENT_SUBSCRIPTION_ID"
          echo "Tenant       : $CURRENT_TENANT_ID"
          echo "Client ID    : $servicePrincipalId"

          if [ "$CURRENT_SUBSCRIPTION_ID" != "$EXPECTED_SUBSCRIPTION_ID" ]; then
            echo "ERROR: Incorrect Azure Subscription."
            exit 1
          fi

          if [ "$CURRENT_TENANT_ID" != "$EXPECTED_TENANT_ID" ]; then
            echo "ERROR: Incorrect Azure Tenant."
            exit 1
          fi

          if [ "$servicePrincipalId" != "$EXPECTED_CLIENT_ID" ]; then
            echo "ERROR: Incorrect deployment identity."
            exit 1
          fi

          echo "Azure authentication validation PASSED."

          # --------------------------------------------------
          # Runtime secrets
          # --------------------------------------------------
          export TF_VAR_secrets="$(jq -cn \
            --arg vm "${VM_ADMIN_PASSWORD:-}" \
            --arg s2s "${S2S_SHARED_KEY:-}" \
            --arg radius "${P2S_RADIUS_SECRET:-}" \
            --arg root "${TRUSTED_ROOT_CERTIFICATE_DATA:-}" \
            '{vm_admin_password:$vm,s2s_shared_key:$s2s,p2s_radius_secret:$radius,trusted_root_certificate_data:$root}')"

          # --------------------------------------------------
          # Terraform
          # --------------------------------------------------
          terraform fmt -recursive

          terraform init \
            -reconfigure \
            -backend-config='$(backendConfig)'

          terraform validate

          terraform plan \
            -var-file='$(tfVars)' \
            -out='$(Build.ArtifactStagingDirectory)/iwmf-prod.tfplan'

          terraform show \
            -no-color \
            '$(Build.ArtifactStagingDirectory)/iwmf-prod.tfplan' \
            > '$(Build.ArtifactStagingDirectory)/iwmf-prod-plan.txt'

          echo ""
          echo "Terraform PLAN completed successfully."

      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)

        VM_ADMIN_PASSWORD: $(VM_ADMIN_PASSWORD)
        S2S_SHARED_KEY: $(S2S_SHARED_KEY)
        P2S_RADIUS_SECRET: $(P2S_RADIUS_SECRET)
        TRUSTED_ROOT_CERTIFICATE_DATA: $(TRUSTED_ROOT_CERTIFICATE_DATA)

    - publish: '$(Build.ArtifactStagingDirectory)'
      artifact: terraform-plan
      displayName: Publish Terraform plan artifact


# ==========================================================
# STAGE 2 - APPROVED PRODUCTION APPLY
# ==========================================================
- stage: Apply
  displayName: Terraform Apply

  dependsOn: ValidatePlan

  condition: |
    and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/master')
    )

  jobs:
  - deployment: ApplyProd
    displayName: Apply approved IWMF2 production plan

    environment: iwmf2-prod

    pool:
      name: agent-iwmf-sea-pipeline-01   

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self
            clean: true
            persistCredentials: false

          - download: current
            artifact: terraform-plan

          - script: |
              curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
              sudo apt-get install -y unzip
            displayName: Install Azure CLI

          - task: AzureCLI@2
            displayName: Apply exact approved Terraform plan

            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: '$(tfRoot)'

              inlineScript: |
                set -euo pipefail

                echo "=================================================="
                echo " IWMF2 Terraform Production Apply"
                echo "=================================================="

                export TERRAFORM_VERSION='$(terraformVersion)'

                bash ./scripts/install-terraform.sh

                export PATH="$HOME/bin:$PATH"

                terraform version

                source ./scripts/export-azure-oidc.sh

                # ----------------------------------------------
                # Validate Azure identity again before apply
                # ----------------------------------------------
                EXPECTED_SUBSCRIPTION_ID="0bec3890-91f5-46f9-954a-434049775d9a"
                EXPECTED_TENANT_ID="3931aa7a-2905-494d-81a2-a046c1c68db7"
                EXPECTED_CLIENT_ID="05069eac-f757-41c7-85cf-e2180adbbf14"

                CURRENT_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                CURRENT_TENANT_ID=$(az account show --query tenantId -o tsv)

                echo ""
                echo "Subscription : $CURRENT_SUBSCRIPTION_ID"
                echo "Tenant       : $CURRENT_TENANT_ID"
                echo "Client ID    : $servicePrincipalId"

                if [ "$CURRENT_SUBSCRIPTION_ID" != "$EXPECTED_SUBSCRIPTION_ID" ]; then
                  echo "ERROR: Incorrect Azure Subscription."
                  exit 1
                fi

                if [ "$CURRENT_TENANT_ID" != "$EXPECTED_TENANT_ID" ]; then
                  echo "ERROR: Incorrect Azure Tenant."
                  exit 1
                fi

                if [ "$servicePrincipalId" != "$EXPECTED_CLIENT_ID" ]; then
                  echo "ERROR: Incorrect deployment identity."
                  exit 1
                fi

                echo "Azure authentication validation PASSED."

                # ----------------------------------------------
                # Runtime secrets
                # ----------------------------------------------
                export TF_VAR_secrets="$(jq -cn \
                  --arg vm "${VM_ADMIN_PASSWORD:-}" \
                  --arg s2s "${S2S_SHARED_KEY:-}" \
                  --arg radius "${P2S_RADIUS_SECRET:-}" \
                  --arg root "${TRUSTED_ROOT_CERTIFICATE_DATA:-}" \
                  '{vm_admin_password:$vm,s2s_shared_key:$s2s,p2s_radius_secret:$radius,trusted_root_certificate_data:$root}')"

                # ----------------------------------------------
                # Initialize remote backend
                # ----------------------------------------------
                terraform init \
                  -reconfigure \
                  -backend-config='$(backendConfig)'

                # ----------------------------------------------
                # Apply exact reviewed plan artifact
                # ----------------------------------------------
                terraform apply \
                  -auto-approve \
                  '$(Pipeline.Workspace)/terraform-plan/iwmf-prod.tfplan'

                echo ""
                echo "IWMF Terraform APPLY completed successfully."

            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

              VM_ADMIN_PASSWORD: $(VM_ADMIN_PASSWORD)
              S2S_SHARED_KEY: $(S2S_SHARED_KEY)
              P2S_RADIUS_SECRET: $(P2S_RADIUS_SECRET)
              TRUSTED_ROOT_CERTIFICATE_DATA: $(TRUSTED_ROOT_CERTIFICATE_DATA)